<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/kit/kit.css">
<script src="/kit/kit.js"></script>
<style>
html,body{margin:0;padding:0;background:#000}
#thumb{position:relative;width:1280px;height:720px;overflow:hidden;
 background:radial-gradient(circle at 70% 45%,#5a1450 0%,#3a0d4f 28%,#160f38 60%,#0b0f2a 100%);}
.layer{position:absolute;left:0;top:0;width:1280px;height:720px}
#headline{position:absolute;left:42px;top:34px;transform:rotate(-4deg);transform-origin:left top;
 font-family:'Anton';color:#fff;line-height:.92;letter-spacing:1px;
 filter:drop-shadow(9px 10px 0 #000) drop-shadow(0 0 30px rgba(255,77,26,.35));}
#headline span{display:block;-webkit-text-stroke:10px #000;paint-order:stroke fill;}
#headline .l1{font-size:130px}
#headline .l2{font-size:158px}
#astro{filter:drop-shadow(-3px -3px 0 rgba(255,120,60,.9)) drop-shadow(0 0 22px rgba(255,77,26,.45)) drop-shadow(10px 14px 14px rgba(0,0,0,.6));}
</style></head>
<body>
<div id="thumb">
 <div id="bg" class="layer"></div>
 <div id="moon" class="layer"></div>
 <div id="astro" class="layer k-rim" style="--k-rim-color:#ff6a2b"></div>
 <div id="fx" class="layer"></div>
 <div id="headline"><span class="l1">IT'S</span><span class="l2">CRACKING</span></div>
 <div class="k-grain"></div>
 <div class="k-vignette"></div>
</div>
<script>
kit.seed(42);
var R=kit.rand;
// stars
var s='';
for(var i=0;i<170;i++){var x=R()*1280,y=R()*720,r=R()<.08?1.9:R()*1.1+.3,o=.3+R()*.7;
 s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(2)+'" fill="#fff" opacity="'+o.toFixed(2)+'"/>';}
kit.mount('#bg',kit.svg(s,{width:1280,height:720}));

// moon
var cx=880,cy=330,mr=300;
var pts=[[560,150],[640,180],[700,228],[690,268],[760,296],[805,272],[852,334],[832,374],[915,402],[962,380],[1020,448],[1092,466],[1200,530]];
var top=[],bot=[];
pts.forEach(function(p,i){var w=(i==0||i==pts.length-1)?1:6+R()*9;top.push([p[0]+R()*3,p[1]-w]);bot.push([p[0]-R()*3,p[1]+w]);});
function ps(a){return a.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');}
var crackPoly=ps(top.concat(bot.slice().reverse()));
var line=ps(pts);
// branches
var branches=[[[700,228],[668,286],[640,300],[612,352]],[[852,334],[880,268],[918,240],[940,190]],[[915,402],[890,460],[905,520],[880,590]],[[1020,448],[1050,392],[1100,370]],[[760,296],[748,350],[720,380]]];
var br=branches.map(function(b){return '<polyline points="'+ps(b)+'"/>';}).join('');
// craters
var cr='';
[[760,140,46],[1010,200,60],[700,470,52],[960,560,38],[1090,320,30],[820,520,24],[640,360,22],[1060,560,28],[900,120,22]].forEach(function(c){
 cr+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+c[2]+'" fill="url(#crater)"/><circle cx="'+(c[0]+c[2]*.12)+'" cy="'+(c[1]+c[2]*.12)+'" r="'+c[2]*.92+'" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2.5"/>';});
var m=''+
'<defs>'+
'<radialGradient id="mg" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#e9e4f0"/><stop offset=".45" stop-color="#a59cb4"/><stop offset=".85" stop-color="#4b3f62"/><stop offset="1" stop-color="#2a2140"/></radialGradient>'+
'<radialGradient id="crater" cx="60%" cy="60%" r="60%"><stop offset="0" stop-color="#8d84a0"/><stop offset=".8" stop-color="#6d6383"/><stop offset="1" stop-color="#4d4462" /></radialGradient>'+
'<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset=".55" stop-color="#ff4d1a" stop-opacity=".55"/><stop offset=".75" stop-color="#ff4d1a" stop-opacity=".15"/><stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/></radialGradient>'+
'<linearGradient id="magma" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset=".5" stop-color="#ffb02e"/><stop offset="1" stop-color="#ff4d1a"/></linearGradient>'+
'<clipPath id="mc"><circle cx="'+cx+'" cy="'+cy+'" r="'+mr+'"/></clipPath>'+
'<filter id="b18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>'+
'<filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>'+
'</defs>'+
'<circle cx="'+cx+'" cy="'+cy+'" r="'+(mr+110)+'" fill="url(#halo)"/>'+
'<circle cx="'+cx+'" cy="'+cy+'" r="'+mr+'" fill="url(#mg)"/>'+
'<g clip-path="url(#mc)">'+cr+
 // heated area around crack
 '<polyline points="'+line+'" fill="none" stroke="#ff4d1a" stroke-width="90" stroke-linejoin="round" opacity=".35" filter="url(#b18)"/>'+
 '<g fill="none" stroke="#ff5a1f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#b6)">'+br+'</g>'+
 '<g fill="none" stroke="#2a0d0a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">'+br+'</g>'+
 '<g fill="none" stroke="#ffb347" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+br+'</g>'+
 '<polygon points="'+crackPoly+'" fill="#ff4d1a" filter="url(#b6)" transform="scale(1)"/>'+
 '<polygon points="'+crackPoly+'" fill="#2a0806" stroke="#2a0806" stroke-width="8" stroke-linejoin="round"/>'+
 '<polygon points="'+crackPoly+'" fill="url(#magma)"/>'+
 '<polyline points="'+line+'" fill="none" stroke="#fffbe6" stroke-width="3" stroke-linejoin="round"/>'+
 // terminator shadow
 '<circle cx="'+(cx+150)+'" cy="'+(cy+120)+'" r="'+(mr+40)+'" fill="none" stroke="rgba(10,5,30,.45)" stroke-width="140" filter="url(#b18)"/>'+
'</g>'+
'<circle cx="'+cx+'" cy="'+cy+'" r="'+mr+'" fill="none" stroke="#ff7a3a" stroke-width="3" opacity=".6"/>';
// debris
var deb='';
[[1150,140,22,20],[1210,230,13,-30],[1100,90,9,50],[1220,360,16,10],[600,120,12,-15]].forEach(function(d){
 var n=6,pp=[];for(var k=0;k<n;k++){var a=k/n*Math.PI*2,rr=d[2]*(.7+R()*.5);pp.push([d[0]+Math.cos(a)*rr,d[1]+Math.sin(a)*rr]);}
 deb+='<g transform="rotate('+d[3]+' '+d[0]+' '+d[1]+')"><polygon points="'+ps(pp)+'" fill="#7a6e8e" stroke="#ff6a2b" stroke-width="3" stroke-linejoin="round"/></g>';
 deb+='<circle cx="'+d[0]+'" cy="'+d[1]+'" r="'+(d[2]*1.6)+'" fill="#ff4d1a" opacity=".18"/>';});
// sparks
for(var j=0;j<26;j++){var t=R(),px=640+t*540+(R()-.5)*60,py=180+t*330+(R()-.5)*60-R()*40;
 deb+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+(1+R()*2.5).toFixed(1)+'" fill="#ffcf6a" opacity="'+(.5+R()*.5).toFixed(2)+'"/>';}
kit.mount('#moon',kit.svg(m+deb,{width:1280,height:720}));

// astronaut
var ch=kit.character({body:'round',color:'#f4f4f7',emotion:'shock',pose:'hands-cheeks',x:420,y:410,size:270,accessories:['helmet'],look:[0.7,-0.7],limbColor:'#e6e6ee'});
var visor='<ellipse cx="560" cy="520" rx="150" ry="40" fill="#ff4d1a" opacity="0"/>';
kit.mount('#astro',kit.svg(ch+visor,{width:1280,height:720}));

// arrow text -> crack
kit.mount('#fx',kit.svg(kit.arrow({from:[520,345],to:[688,258],color:'#ffffff',width:7,curve:-0.35}),{width:1280,height:720}));
kit.ready();
</script>
</body></html>
