<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/kit/kit.css">
<script src="/kit/kit.js"></script>
<style>
html,body{margin:0;padding:0;background:#000}
#thumb{position:relative;width:1280px;height:720px;overflow:hidden;
 background:radial-gradient(circle at 33% 48%,#5fd0ff 0%,#1fb5ff 30%,#0a6fd6 80%,#07549f 100%)}
.layer{position:absolute;left:0;top:0;width:1280px;height:720px}
.layer svg{position:absolute;left:0;top:0}
#txt{position:absolute;left:660px;top:120px;width:580px;text-align:center;transform:rotate(-5deg);transform-origin:center}
#txt div{font-family:'Luckiest Guy';color:#ffe11f;line-height:.92;white-space:nowrap;
 --k-stroke-color:#000;--k-extrude-color:#b8400a}
#l1{font-size:190px}
#l2{font-size:170px}
</style></head>
<body>
<div id="thumb">
 <div class="layer" id="rays"></div>
 <div class="layer" id="char"></div>
 <div class="layer" id="pig"></div>
 <div id="txt">
  <div id="l1" class="k-stroke-lg k-extrude">IT'S</div>
  <div id="l2" class="k-stroke-lg k-extrude">MELTING</div>
 </div>
 <div class="k-vignette"></div>
 <div class="k-grain"></div>
</div>
<script>
kit.seed(7);
// sunburst rays behind the character
(function(){
 var cx=400,cy=360,R=1400,n=20,s='';
 for(var i=0;i<n;i++){
  var a0=(i/n)*Math.PI*2+kit.rand()*0.02, a1=a0+Math.PI/n*0.9;
  s+='<path d="M'+cx+','+cy+' L'+(cx+R*Math.cos(a0))+','+(cy+R*Math.sin(a0))+' L'+(cx+R*Math.cos(a1))+','+(cy+R*Math.sin(a1))+' Z" fill="#ffffff" opacity="0.11"/>';
 }
 s+='<defs><radialGradient id="glow"><stop offset="0" stop-color="#bff0ff" stop-opacity=".55"/><stop offset="1" stop-color="#bff0ff" stop-opacity="0"/></radialGradient></defs>';
 s+='<circle cx="400" cy="330" r="360" fill="url(#glow)"/>';
 s+='<ellipse cx="350" cy="700" rx="250" ry="30" fill="#032f63" opacity=".45"/>';
 kit.mount('#rays',kit.svg(s,{width:1280,height:720}));
})();

// character
(function(){
 var c=kit.character({body:'blob',color:'#46d65a',emotion:'fear',pose:'hold-up',x:140,y:225,size:480,look:[0,-1],limbColor:'#2fb244'});
 // sweat drops
 var sw='';
 [[205,360,1.1],[540,340,1],[575,410,0.8],[180,440,0.7]].forEach(function(d){
  sw+='<g transform="translate('+d[0]+','+d[1]+') scale('+d[2]+')"><path d="M0,-28 C10,-10 18,2 18,12 A18,18 0 0 1 -18,12 C-18,2 -10,-10 0,-28Z" fill="#c9f2ff" stroke="#062a4a" stroke-width="5"/><ellipse cx="-6" cy="8" rx="4" ry="7" fill="#fff"/></g>';
 });
 kit.mount('#char',kit.svg('<g class="k-drop">'+c+'</g>'+sw,{width:1280,height:720}));
})();

// melting piggy bank, coins, shimmer
(function(){
 var ink='#2a0f1a';
 var s='<defs>'+
 '<radialGradient id="pk" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#ffc2dc"/><stop offset=".55" stop-color="#ff7fb2"/><stop offset="1" stop-color="#e44d8e"/></radialGradient>'+
 '<radialGradient id="gold" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff6a8"/><stop offset=".6" stop-color="#ffcc1a"/><stop offset="1" stop-color="#d98a00"/></radialGradient>'+
 '<filter id="ds" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#021a3a" flood-opacity=".5"/></filter>'+
 '</defs>';
 // heat shimmer
 s+='<g fill="none" stroke-linecap="round">';
 [[345,'#ff9a1f'],[400,'#fff3a0'],[455,'#ff9a1f']].forEach(function(h,i){
  var x=h[0];
  s+='<path d="M'+x+',78 c-14,-10 14,-20 0,-30 c-14,-10 14,-20 0,-30" stroke="'+ink+'" stroke-width="13" opacity=".35"/>';
  s+='<path d="M'+x+',78 c-14,-10 14,-20 0,-30 c-14,-10 14,-20 0,-30" stroke="'+h[1]+'" stroke-width="8"/>';
 });
 s+='</g>';
 s+='<g filter="url(#ds)">';
 // back ear
 s+='<path d="M372,108 L398,58 L425,104 Z" fill="#e44d8e" stroke="'+ink+'" stroke-width="7" stroke-linejoin="round"/>';
 // body + goo
 var body='M262,200 A138 110 0 0 1 538,200 C538,235 530,260 515,275 C500,290 486,300 486,335 C486,352 466,352 466,335 C466,310 460,296 440,298 C420,300 410,315 410,365 C410,394 384,394 384,365 C384,310 380,295 360,295 C340,295 332,305 332,330 C332,352 312,352 312,330 C312,300 310,288 300,285 C280,280 262,250 262,200 Z';
 s+='<path d="'+body+'" fill="url(#pk)" stroke="'+ink+'" stroke-width="8" stroke-linejoin="round"/>';
 // goo sheen
 s+='<path d="M300,250 C330,272 380,280 430,272" fill="none" stroke="#ffd6e8" stroke-width="7" stroke-linecap="round" opacity=".8"/>';
 s+='<ellipse cx="395" cy="355" rx="4" ry="10" fill="#fff" opacity=".7"/>';
 s+='<ellipse cx="320" cy="325" rx="3" ry="7" fill="#fff" opacity=".7"/>';
 // falling drop
 s+='<path d="M397,402 C405,416 411,424 411,432 A14,14 0 0 1 383,432 C383,424 389,416 397,402Z" fill="#ff7fb2" stroke="'+ink+'" stroke-width="6"/>';
 // front ear
 s+='<path d="M318,128 L322,62 L370,104 Z" fill="#ff9cc4" stroke="'+ink+'" stroke-width="7" stroke-linejoin="round"/>';
 // slot
 s+='<rect x="372" y="96" width="62" height="13" rx="6" fill="'+ink+'"/>';
 // snout
 s+='<ellipse cx="540" cy="178" rx="30" ry="38" fill="#ff8fbd" stroke="'+ink+'" stroke-width="7"/>';
 s+='<ellipse cx="533" cy="164" rx="5" ry="9" fill="'+ink+'"/><ellipse cx="546" cy="192" rx="5" ry="9" fill="'+ink+'"/>';
 // worried eye + brow + tear
 s+='<circle cx="470" cy="150" r="20" fill="#fff" stroke="'+ink+'" stroke-width="6"/><circle cx="476" cy="146" r="9" fill="'+ink+'"/><circle cx="479" cy="142" r="3" fill="#fff"/>';
 s+='<path d="M446,118 L492,128" stroke="'+ink+'" stroke-width="8" stroke-linecap="round"/>';
 s+='<path d="M466,178 C472,190 476,196 476,202 A10,10 0 0 1 456,202 C456,196 460,190 466,178Z" fill="#c9f2ff" stroke="'+ink+'" stroke-width="4"/>';
 // highlight
 s+='<ellipse cx="320" cy="150" rx="26" ry="16" fill="#fff" opacity=".55" transform="rotate(-30 320 150)"/>';
 // coin sliding out of goo
 s+='<g transform="translate(452,318) rotate(-20)"><ellipse rx="22" ry="22" fill="url(#gold)" stroke="'+ink+'" stroke-width="5"/><text x="0" y="10" text-anchor="middle" font-family="Archivo Black" font-size="26" fill="#a85f00">$</text></g>';
 s+='</g>';
 // falling coins
 function coin(x,y,r,rot,sq){
  var g='<g transform="translate('+x+','+y+') rotate('+rot+')">';
  g+='<path d="M'+(-r*0.4)+','+(-r*2.6)+' L'+(-r*0.4)+','+(-r*1.4)+' M'+(r*0.4)+','+(-r*2.9)+' L'+(r*0.4)+','+(-r*1.5)+'" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>';
  g+='<g transform="scale('+sq+',1)"><ellipse rx="'+r+'" ry="'+r+'" fill="url(#gold)" stroke="'+ink+'" stroke-width="6"/>';
  g+='<ellipse rx="'+(r*0.7)+'" ry="'+(r*0.7)+'" fill="none" stroke="#c77a00" stroke-width="4"/>';
  g+='<text x="0" y="'+(r*0.38)+'" text-anchor="middle" font-family="Archivo Black" font-size="'+(r*1.1)+'" fill="#a85f00">$</text></g></g>';
  return g;
 }
 s+='<g filter="url(#ds)">'+coin(600,470,34,18,0.75)+coin(235,520,28,-25,0.6)+coin(590,640,26,35,0.9)+'</g>';
 kit.mount('#pig',kit.svg(s,{width:1280,height:720}));
})();

// fit headline to column
function fit(id,max){var el=document.getElementById(id),fs=parseFloat(getComputedStyle(el).fontSize);
 while(el.scrollWidth>max&&fs>60){fs-=4;el.style.fontSize=fs+'px';}}
document.fonts.ready.then(function(){fit('l1',560);fit('l2',570);kit.ready();});
</script>
</body></html>
