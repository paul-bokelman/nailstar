<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/kit/kit.css">
<script src="/kit/kit.js"></script>
<style>
html,body{margin:0;background:#000}
#thumb{position:relative;width:1280px;height:720px;overflow:hidden;
background:radial-gradient(circle at 768px 288px,#063646 0%,#012230 14%,#001a26 26%,#000a10 50%,#000 75%);}
#art{position:absolute;inset:0}
#hl{position:absolute;left:54px;bottom:46px;font-family:'Bebas Neue';color:#fff;font-size:156px;line-height:.86;letter-spacing:7px;
text-shadow:0 0 18px rgba(56,249,255,.85),0 0 46px rgba(56,249,255,.55),0 6px 0 #000,0 10px 24px #000;
--k-stroke-color:#000;}
#hl .a{display:block;font-size:118px;letter-spacing:10px;color:#38f9ff;
text-shadow:0 0 14px rgba(56,249,255,.9),0 0 40px rgba(56,249,255,.6),0 5px 0 #000}
</style></head>
<body>
<div id="thumb">
  <div id="art"></div>
  <div id="hl" class="k-stroke-md"><span class="a">DON'T</span>FOLLOW IT</div>
  <div class="k-vignette"></div>
  <div class="k-grain"></div>
</div>
<script>
kit.seed(7);
const LX=768, LY=288;
function bz(p,t){const u=1-t;return[u*u*u*p[0][0]+3*u*u*t*p[1][0]+3*u*t*t*p[2][0]+t*t*t*p[3][0],u*u*u*p[0][1]+3*u*u*t*p[1][1]+3*u*t*t*p[2][1]+t*t*t*p[3][1]];}
function lit(x,y){const d=Math.hypot(x-LX,y-LY);return Math.max(0.12,Math.min(1,1.25-d/420));}
const UP=[[770,335],[850,392],[1000,408],[1210,388]];
const LO=[[640,425],[760,482],[950,488],[1210,442]];
let s='';
s+=`<defs>
<radialGradient id="body" gradientUnits="userSpaceOnUse" cx="${LX}" cy="${LY}" r="620">
<stop offset="0" stop-color="#2a6e7c"/><stop offset=".22" stop-color="#0d3a46"/><stop offset=".5" stop-color="#031820"/><stop offset=".8" stop-color="#01070a"/><stop offset="1" stop-color="#000"/></radialGradient>
<radialGradient id="rim" gradientUnits="userSpaceOnUse" cx="${LX}" cy="${LY}" r="480">
<stop offset="0" stop-color="#c8feff"/><stop offset=".35" stop-color="#38f9ff" stop-opacity=".8"/><stop offset="1" stop-color="#38f9ff" stop-opacity="0"/></radialGradient>
<radialGradient id="mouth" gradientUnits="userSpaceOnUse" cx="820" cy="400" r="420">
<stop offset="0" stop-color="#062029"/><stop offset=".5" stop-color="#010507"/><stop offset="1" stop-color="#000"/></radialGradient>
<linearGradient id="tooth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9ff4fa"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#38f9ff" stop-opacity=".55"/><stop offset=".4" stop-color="#38f9ff" stop-opacity=".16"/><stop offset="1" stop-color="#38f9ff" stop-opacity="0"/></radialGradient>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur2"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs>`;
// particles
for(let i=0;i<70;i++){const x=kit.rand()*1280,y=kit.rand()*720,r=0.8+kit.rand()*2.4;const a=lit(x,y);
 s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#bffcff" opacity="${(a*0.85).toFixed(2)}" ${r>2.4?'filter="url(#blur2)"':''}/>`;}
// big halo
s+=`<circle cx="${LX}" cy="${LY}" r="430" fill="url(#halo)"/>`;
// body
s+=`<path d="M1300 30 C1120 22 900 110 770 335 L640 425 C650 560 780 690 960 740 L1300 740 Z" fill="url(#body)"/>`;
// skin spots
for(let i=0;i<55;i++){const x=780+kit.rand()*500,y=60+kit.rand()*660;const inMouth=y>330&&y<500&&x>700;if(inMouth)continue;
 s+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(2+kit.rand()*6).toFixed(1)}" fill="#000" opacity=".35"/>`;}
// mouth
const up=`M${UP[0]} C${UP[1]} ${UP[2]} ${UP[3]}`;
s+=`<path d="${up} L1210 442 C${LO[2]} ${LO[1]} ${LO[0]} Z" fill="url(#mouth)"/>`;
// teeth
function tooth(bx,by,len,w,dx,dir){const tx=bx+dx,ty=by+dir*len;const a=lit(bx,by);
 return `<path d="M${bx-w} ${by} Q${bx-w*0.2+dx*0.4} ${by+dir*len*0.6} ${tx} ${ty} Q${bx+w*0.5+dx*0.5} ${by+dir*len*0.55} ${bx+w} ${by} Z" fill="url(#tooth)" opacity="${(0.25+a*0.75).toFixed(2)}"/>`;}
let teeth='';
for(let i=0;i<14;i++){const t=0.04+i*0.068+kit.rand()*0.02;const [x,y]=bz(UP,t);const len=(1-t)*70+22+kit.rand()*25;teeth+=tooth(x,y-2,len,4+(1-t)*3,(kit.rand()-.5)*14,1);}
for(let i=0;i<15;i++){const t=0.02+i*0.064+kit.rand()*0.02;const [x,y]=bz(LO,t);const len=(1-t)*95+25+kit.rand()*30;teeth+=tooth(x,y+2,len,4.5+(1-t)*4,-8-kit.rand()*14,-1);}
s+=teeth;
// rim lights
s+=`<path d="M1280 32 C1120 24 900 112 770 335" fill="none" stroke="url(#rim)" stroke-width="4" stroke-linecap="round"/>`;
s+=`<path d="${up}" fill="none" stroke="url(#rim)" stroke-width="2.5" opacity=".8"/>`;
s+=`<path d="M${LO[0]} C${LO[1]} ${LO[2]} ${LO[3]}" fill="none" stroke="url(#rim)" stroke-width="3.5"/>`;
s+=`<path d="M640 425 C650 560 780 690 960 740" fill="none" stroke="url(#rim)" stroke-width="3" opacity=".7"/>`;
// eye
s+=`<circle cx="985" cy="238" r="13" fill="#000" stroke="#1d5866" stroke-width="2"/><circle cx="985" cy="238" r="8" fill="#0b2d36"/><circle cx="981" cy="234" r="3" fill="#e9feff"/>`;
// stalk
s+=`<path d="M975 140 C920 20 770 30 768 272" fill="none" stroke="#04202a" stroke-width="7" stroke-linecap="round"/>`;
s+=`<path d="M975 140 C920 20 770 30 768 272" fill="none" stroke="url(#rim)" stroke-width="2.5" stroke-linecap="round"/>`;
// lure
s+=`<circle cx="${LX}" cy="${LY}" r="70" fill="#38f9ff" opacity=".45" filter="url(#blur8)"/>`;
s+=`<circle cx="${LX}" cy="${LY}" r="34" fill="#7ffcff" opacity=".8" filter="url(#blur8)"/>`;
s+=`<circle cx="${LX}" cy="${LY}" r="18" fill="#c9feff"/><circle cx="${LX}" cy="${LY}" r="10" fill="#fff"/>`;
for(let i=0;i<4;i++){const dx=-14+i*9;s+=`<path d="M${LX+dx*0.4} ${LY+14} q${dx*0.6} 22 ${dx} ${30+i*6}" fill="none" stroke="#7ffcff" stroke-width="1.6" opacity=".7"/>`;}
kit.mount('#art',kit.svg(s,{width:1280,height:720}));
kit.ready();
</script>
</body></html>
